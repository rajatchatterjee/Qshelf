<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15212c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>[hidden]{display:none!important}img{max-width:100%}</style>
<title>Qshelf</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;1,7..72,400&family=Atkinson+Hyperlegible:wght@400;700&family=Figtree:wght@400;500&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one immersive card per screen, snapped vertically; story-style segments on top, a chrome bar that hides in focus mode, and a bottom sheet for reading settings */
:root{
  --bg:#e9edf1; --surface:#fbfcfd; --ink:#15212c; --muted:#5b6977; --line:#cfd7df; --accent:#2b5c8a; --scrim:rgba(10,16,22,.45);
  --h-habits:#3f8a5c; --h-mind:#5a5fc4; --h-money:#b07f22; --h-work:#2f78b5; --h-people:#c2557a; --h-meaning:#8a5bb8; --h-strategy:#278a8a;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-serif:"Literata",Georgia,"Times New Roman",serif;
  --f-sans:"Figtree",ui-sans-serif,system-ui,sans-serif;
  --f-readable:"Atkinson Hyperlegible",Verdana,ui-sans-serif,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --f-read:var(--f-serif); --scale:1; --lh:1.62;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1217; --surface:#161d25; --ink:#e7edf2; --muted:#93a2b0; --line:#2a3540; --accent:#7fb0de; --scrim:rgba(0,0,0,.6);
  --h-habits:#6cc48f; --h-mind:#9a9ef0; --h-money:#e2b65c; --h-work:#6aaee6; --h-people:#ec8aab; --h-meaning:#bb92e6; --h-strategy:#5cc4c4;
  color-scheme:dark}}
:root[data-theme="dark"],:root[data-skin="night"]{
  --bg:#0d1217; --surface:#161d25; --ink:#e7edf2; --muted:#93a2b0; --line:#2a3540; --accent:#7fb0de; --scrim:rgba(0,0,0,.6);
  --h-habits:#6cc48f; --h-mind:#9a9ef0; --h-money:#e2b65c; --h-work:#6aaee6; --h-people:#ec8aab; --h-meaning:#bb92e6; --h-strategy:#5cc4c4;
  color-scheme:dark}
/* reading skins chosen in settings */
:root[data-skin="paper"],:root[data-skin="sepia"]{
  --h-habits:#3f8a5c; --h-mind:#5a5fc4; --h-money:#b07f22; --h-work:#2f78b5; --h-people:#c2557a; --h-meaning:#8a5bb8; --h-strategy:#278a8a; --scrim:rgba(10,16,22,.45); color-scheme:light}
:root[data-skin="paper"]{--bg:#e9edf1; --surface:#fbfcfd; --ink:#15212c; --muted:#5b6977; --line:#cfd7df; --accent:#2b5c8a}
:root[data-skin="sepia"]{--bg:#ece0c8; --surface:#f7efdd; --ink:#3a2a1a; --muted:#7a654d; --line:#d9c6a6; --accent:#9a5427;
  --h-habits:#55803d; --h-mind:#5d5aa8; --h-money:#a26b12; --h-work:#3a6f96; --h-people:#b2485f; --h-meaning:#82508f; --h-strategy:#2f7c73}
:root[data-skin="midnight"],:root[data-skin="forest"]{
  --h-habits:#6cc48f; --h-mind:#9a9ef0; --h-money:#e2b65c; --h-work:#6aaee6; --h-people:#ec8aab; --h-meaning:#bb92e6; --h-strategy:#5cc4c4; --scrim:rgba(0,0,0,.6); color-scheme:dark}
:root[data-skin="midnight"]{--bg:#081027; --surface:#101b3b; --ink:#efece2; --muted:#9ca5c4; --line:#24305a; --accent:#e6bc62}
:root[data-skin="forest"]{--bg:#0b1713; --surface:#13241d; --ink:#e7f0ea; --muted:#93ad9f; --line:#24392f; --accent:#8fd6a8}
:root[data-font="sans"]{--f-read:var(--f-sans)}
:root[data-font="readable"]{--f-read:var(--f-readable)}

:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
html,body{height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-read);display:flex;flex-direction:column;overflow:hidden;transition:background-color .4s,color .4s;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* chrome */
.chrome{display:grid;grid-template-rows:1fr;transition:grid-template-rows .35s ease,opacity .3s}
.chrome>div{overflow:hidden;min-height:0}
body.focus .chrome{grid-template-rows:0fr;opacity:0;pointer-events:none}
.top{display:flex;flex-direction:column;gap:10px;padding-block:12px 10px}
.bar{display:flex;align-items:center;gap:10px}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.3rem;letter-spacing:-.03em;margin:0;flex:1;min-width:0;display:flex;align-items:baseline}
.brand b{color:var(--accent);font-weight:800}
.brand span{font-weight:500}
.count{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;height:36px;padding:0 12px 0 8px;font-family:var(--f-mono);font-size:.82rem;font-variant-numeric:tabular-nums}
.pill svg.r{width:20px;height:20px;transform:rotate(-90deg)}
.trk{stroke:var(--line)} .val{stroke:var(--accent);transition:stroke-dashoffset 1s linear}
.pill.done .val{stroke:var(--h-habits)}
.round{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.round svg,.icon svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding:2px 4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-family:var(--f-display);font-size:.84rem;font-weight:500;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* story segments */
.segs{display:flex;gap:3px;height:3px;margin-block:2px 8px}
.segs i{flex:1;border-radius:2px;background:var(--line);transition:background-color .3s}
.segs i.on{background:var(--ink)}
.segs.bar1 i{background:linear-gradient(90deg,var(--ink) var(--p,0%),var(--line) var(--p,0%))}

/* feed + cards */
.feed{flex:1;min-height:0;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none}
.feed::-webkit-scrollbar{display:none}
.slot{min-height:100%;padding-block:0 12px;scroll-snap-align:start;display:flex}
.card{--hue:var(--accent);flex:1;border-radius:24px;position:relative;isolation:isolate;overflow:hidden;
  background:radial-gradient(120% 70% at 100% 0%,color-mix(in oklab,var(--hue) 24%,transparent),transparent 62%),radial-gradient(90% 55% at 0% 100%,color-mix(in oklab,var(--hue) 12%,transparent),transparent 70%),color-mix(in oklab,var(--hue) 6%,var(--surface));
  border:1px solid color-mix(in oklab,var(--hue) 22%,var(--line));
  display:flex;flex-direction:column;padding:clamp(22px,5.5vw,40px);gap:clamp(14px,2.4vh,22px);transition:background-color .4s}
.card>*{max-width:62ch;position:relative}
.glyph{position:absolute!important;right:-.06em;bottom:-.2em;font-family:var(--f-display);font-weight:800;font-size:clamp(15rem,62vw,26rem);line-height:1;color:var(--hue);opacity:.075;pointer-events:none;z-index:-1;user-select:none}
.meta{display:flex;justify-content:space-between;align-items:center;gap:12px;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0}
.tag{color:var(--hue);display:flex;align-items:center;gap:7px}
.tag::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--hue)}
.idea{font-family:var(--f-display);font-weight:700;font-size:calc(clamp(2rem,7.6vw,3.3rem)*var(--scale));line-height:1.02;letter-spacing:-.028em;margin:auto 0 0;text-wrap:balance}
.body{font-size:calc(clamp(1.04rem,4vw,1.22rem)*var(--scale));line-height:var(--lh);margin:0;text-wrap:pretty}
.try{border-left:3px solid var(--hue);padding:4px 0 4px 14px;font-size:calc(.98rem*var(--scale));line-height:var(--lh);margin:0}
.try b{display:block;font-family:var(--f-mono);font-weight:500;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--hue);margin-bottom:3px}
body.notry .try{display:none}
.foot{margin-top:auto;display:flex;align-items:center;gap:8px;padding-top:14px;border-top:1px solid color-mix(in oklab,var(--hue) 25%,var(--line))}
.book{flex:1;min-width:0}
.book .t{font-family:var(--f-display);font-weight:700;font-size:1.02rem;margin:0;line-height:1.2}
.book .a{font-size:.86rem;color:var(--muted);margin:3px 0 0;font-family:var(--f-sans)}
.icon{width:42px;height:42px;border-radius:50%;border:1px solid color-mix(in oklab,var(--hue) 30%,var(--line));background:color-mix(in oklab,var(--surface) 80%,transparent);display:grid;place-items:center;flex:none;transition:background-color .2s,transform .15s}
.icon:active{transform:scale(.92)}
.icon[aria-pressed="true"]{background:var(--hue);border-color:var(--hue);color:var(--surface)}
.icon[data-save][aria-pressed="true"] svg{fill:currentColor}
.card.speaking .body{background:linear-gradient(transparent 60%,color-mix(in oklab,var(--hue) 22%,transparent) 60%);}

.on>.meta,.on>.idea,.on>.body,.on>.try,.on>.foot{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
.on>.idea{animation-delay:.05s}.on>.body{animation-delay:.14s}.on>.try{animation-delay:.22s}.on>.foot{animation-delay:.28s}
.on>.glyph{animation:drift 1.4s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:.2;transform:translateY(16px)}}
@keyframes drift{from{transform:translate(4%,6%) scale(.96)}}
.burst{position:absolute!important;inset:0;display:grid;place-items:center;pointer-events:none;z-index:3;max-width:none!important}
.burst svg{width:96px;height:96px;fill:var(--hue);stroke:none;animation:pop .7s ease-out forwards}
@keyframes pop{0%{transform:scale(.3);opacity:0}30%{transform:scale(1.15);opacity:1}100%{transform:scale(1);opacity:0}}

/* intro / end */
.intro{justify-content:center;gap:20px}
.big{font-family:var(--f-display);font-weight:800;font-size:clamp(2.8rem,12vw,5rem);line-height:.92;letter-spacing:-.04em;margin:0;text-wrap:balance}
.big em{font-style:normal;color:var(--accent)}
.lede{font-size:1.08rem;line-height:1.55;color:var(--muted);margin:0}
.stats{display:flex;gap:28px;flex-wrap:wrap;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stats strong{display:block;font-family:var(--f-display);font-size:1.8rem;letter-spacing:-.02em;color:var(--ink);text-transform:none;font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;flex-wrap:wrap}
.go{border-radius:999px;background:var(--ink);color:var(--bg);padding:14px 24px;font-family:var(--f-display);font-weight:700;font-size:1rem}
.go.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.tips{display:grid;gap:8px;margin:0;padding:0;list-style:none;font-family:var(--f-sans);font-size:.9rem;color:var(--muted)}
.tips li{display:flex;gap:10px;align-items:center}
.tips kbd{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--ink);background:var(--surface);min-width:80px;text-align:center}
.readlist{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-family:var(--f-sans);font-size:.92rem;max-height:34vh;overflow:auto}
.readlist li{display:flex;gap:10px;align-items:baseline}
.readlist li::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--c);flex:none;transform:translateY(-1px)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,0);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-family:var(--f-display);font-size:.9rem;font-weight:500;z-index:30;transition:opacity .25s,transform .25s;white-space:nowrap}
.toast[hidden]{display:block!important;opacity:0;transform:translate(-50%,12px);pointer-events:none}
.mini{position:fixed;top:calc(18px + env(safe-area-inset-top,0px));right:calc(max(16px,env(safe-area-inset-right,0px)) + 14px);z-index:6;font-family:var(--f-mono);font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums;opacity:0;transition:opacity .3s;pointer-events:none}
body.focus .mini{opacity:1}

/* settings sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;transition:opacity .25s}
.scrim[hidden]{display:block!important;opacity:0;pointer-events:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);color:var(--ink);border-radius:24px 24px 0 0;max-height:86%;overflow-y:auto;
  padding:10px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));transition:transform .3s cubic-bezier(.2,.7,.2,1);box-shadow:0 -12px 40px rgba(0,0,0,.18)}
.sheet[hidden]{display:block!important;transform:translateY(105%);visibility:hidden}
.sheet .in{max-width:560px;margin:0 auto;display:grid;gap:22px}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto}
.sheet h2{font-family:var(--f-display);font-weight:700;font-size:1.3rem;margin:0;display:flex;justify-content:space-between;align-items:center}
.grp{display:grid;gap:10px}
.lab{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.sw{display:grid;gap:6px;justify-items:center;font-family:var(--f-sans);font-size:.74rem;color:var(--muted)}
.sw i{width:100%;aspect-ratio:1;max-width:56px;border-radius:14px;border:2px solid transparent;display:grid;place-items:center;font-family:var(--f-display);font-style:normal;font-weight:700;font-size:1.05rem;box-shadow:inset 0 0 0 1px rgba(127,127,127,.25)}
.sw[aria-pressed="true"] i{border-color:var(--accent)}
.sw[aria-pressed="true"]{color:var(--ink)}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px 6px;border-radius:9px;font-family:var(--f-sans);font-size:.88rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg .f-serif{font-family:var(--f-serif)}.seg .f-sans{font-family:var(--f-sans)}.seg .f-readable{font-family:var(--f-readable)}
.sizer{display:flex;align-items:center;gap:12px}
.sizer button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);font-family:var(--f-serif);font-weight:500}
.sizer .dots{flex:1;display:flex;gap:6px;justify-content:center}
.sizer .dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.sizer .dots i.on{background:var(--ink)}
.preview{font-family:var(--f-read);font-size:calc(1.05rem*var(--scale));line-height:var(--lh);margin:0;color:var(--ink);border-left:3px solid var(--accent);padding-left:12px}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;font-family:var(--f-sans);font-size:.95rem;padding-block:4px}
.toggle small{display:block;color:var(--muted);font-size:.8rem;margin-top:2px}
.sw-t{width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background-color .2s}
.sw-t::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw-t[aria-checked="true"]{background:var(--accent)}
.sw-t[aria-checked="true"]::after{transform:translateX(18px)}

@media (min-width:760px){.slot{padding-inline:max(0px,calc((100% - 720px)/2))}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

</head><body>
<div class="chrome"><div>
<header class="top">
  <div class="bar">
    <h1 class="brand"><b>Q</b><span>shelf</span></h1>
    <span class="count" id="count">0 / 12</span>
    <button class="pill" id="clock" aria-label="Session time left">
      <svg class="r" viewBox="0 0 20 20" aria-hidden="true"><circle class="trk" cx="10" cy="10" r="8" fill="none" stroke-width="2.4"/><circle class="val" id="ring" cx="10" cy="10" r="8" fill="none" stroke-width="2.4" stroke-dasharray="50.27" stroke-dashoffset="0" stroke-linecap="round"/></svg>
      <span id="time">5:00</span>
    </button>
    <button class="round" id="openSet" aria-label="Reading settings"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
  </div>
  <nav class="chips" id="chips" aria-label="Shelves"></nav>
</header>
</div></div>
<div class="segs" id="segs" aria-hidden="true"></div>
<span class="mini" id="mini">5:00</span>
<main class="feed" id="feed" tabindex="-1"></main>

<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="setT" hidden>
  <div class="in">
    <div class="grab"></div>
    <h2 id="setT">Reading settings <button class="round" id="closeSet" aria-label="Close settings"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></h2>
    <div class="grp"><span class="lab">Theme</span><div class="swatches" id="skins"></div></div>
    <div class="grp"><span class="lab">Text size</span>
      <div class="sizer"><button id="smaller" aria-label="Smaller text" style="font-size:.85rem">A</button><div class="dots" id="sizeDots"></div><button id="bigger" aria-label="Larger text" style="font-size:1.25rem">A</button></div>
      <p class="preview">Getting a little better each day looks like nothing for weeks. Then the curve bends.</p>
    </div>
    <div class="grp"><span class="lab">Typeface</span><div class="seg" id="fonts">
      <button class="f-serif" data-v="serif">Serif</button><button class="f-sans" data-v="sans">Sans</button><button class="f-readable" data-v="readable">Easy read</button></div></div>
    <div class="grp"><span class="lab">Line spacing</span><div class="seg" id="spacing">
      <button data-v="1.48">Compact</button><button data-v="1.62">Comfort</button><button data-v="1.85">Airy</button></div></div>
    <div class="grp"><span class="lab">Ambience</span><div class="seg" id="amb">
      <button data-v="off">Off</button><button data-v="rain">Rain</button><button data-v="ocean">Ocean</button><button data-v="hearth">Hearth</button></div></div>
    <div class="grp">
      <div class="toggle"><span>Show “Try this”<small>A small action at the end of each idea</small></span><button class="sw-t" role="switch" id="tTry" aria-label="Show Try this"></button></div>
      <div class="toggle"><span>Keep listening<small>Read-aloud moves to the next card on its own</small></span><button class="sw-t" role="switch" id="tAuto" aria-label="Keep listening"></button></div>
    </div>
  </div>
</section>
<div class="toast" id="toast" role="status" hidden></div>

<script>
const THEMES={habits:"Habits",mind:"Thinking",money:"Money",work:"Work",people:"People",meaning:"Meaning",strategy:"Strategy"};
const IDEAS=[
["Atomic Habits","James Clear",2018,"habits","Small gains compound quietly","Getting a little better each day looks like nothing for weeks. Then the curve bends. Most people quit in the flat stretch, right before the payoff shows up.","Pick one habit and shrink it until it takes under two minutes. Do that version today."],
["Atomic Habits","James Clear",2018,"habits","Become the person, not the goal","Goals describe an outcome. Habits stick when they describe who you are. Every repetition is a vote for an identity, and enough votes change how you see yourself.","Finish this sentence: I am the kind of person who… Then do one thing that proves it."],
["Atomic Habits","James Clear",2018,"habits","Design the room, not your willpower","People with strong self-control mostly avoid temptation rather than resist it. Make good cues obvious and bad cues invisible, and the behavior follows.","Move one distraction out of sight and put one helpful tool where you will trip over it."],
["Deep Work","Cal Newport",2016,"work","Focus is a rare and valuable skill","Hard, uninterrupted concentration produces work others can't easily copy. Constant switching leaves a residue of attention on the last task, so you never fully arrive at the next one.","Block 90 minutes on tomorrow's calendar with notifications off. Guard it like a meeting with your boss."],
["Deep Work","Cal Newport",2016,"work","Practice being bored","If you grab your phone every time you wait in line, your brain learns that it never has to tolerate a quiet moment. That makes deep focus much harder later.","Next time you wait, do nothing for two minutes. Just notice the urge and let it pass."],
["Thinking, Fast and Slow","Daniel Kahneman",2011,"mind","Two systems run your head","One system is fast, automatic and confident. The other is slow, effortful and lazy. Most errors happen when the fast one answers a question the slow one should have handled.","Before your next big decision, write down the one fact that would change your mind."],
["Thinking, Fast and Slow","Daniel Kahneman",2011,"mind","The first number sticks","An initial figure, even a random one, pulls later estimates toward it. Negotiators, sellers and salary offers all use this, often without saying so.","In your next negotiation, state your number first and anchor the conversation yourself."],
["Thinking, Fast and Slow","Daniel Kahneman",2011,"mind","You judge from what you can see","The mind builds a confident story from whatever information is in front of it, and rarely asks what's missing. A coherent story feels true even when it's thin.","Ask of any strong opinion you hold: what would I need to know that I don't?"],
["The Psychology of Money","Morgan Housel",2020,"money","Know what enough looks like","Without a clear finish line, the goalpost keeps moving and people risk what they have for things they don't need. Enough is the point where more stops adding to your life.","Write down a number or a life you would call enough. Keep it somewhere you'll see it."],
["The Psychology of Money","Morgan Housel",2020,"money","Leave room for error","Plans fail in ways you can't predict. A buffer of savings, time or slack lets you survive the bad stretch long enough for good decisions to pay off.","Look at one plan you have and add a margin for the scenario you're not expecting."],
["The Psychology of Money","Morgan Housel",2020,"money","Time does the heavy lifting","Most of a famous investor's wealth was built after his sixties, simply because he started early and never stopped. Compounding rewards staying in the game more than brilliance.","Check whether any of your money is sitting idle when it could be compounding."],
["Man's Search for Meaning","Viktor Frankl",1946,"meaning","You choose your response","Frankl watched people in the camps keep their dignity under the worst conditions. Even when circumstances take everything, the attitude you take toward them stays yours.","Name one situation you can't change this week. Decide how you want to show up in it."],
["Man's Search for Meaning","Viktor Frankl",1946,"meaning","Meaning beats comfort","People can endure almost any how if they have a why. Meaning comes from work, from love, and from the way you carry unavoidable suffering.","Write one sentence about who or what your current hard work is for."],
["Meditations","Marcus Aurelius",180,"meaning","The obstacle becomes the path","An emperor's private journal returns again and again to one idea: what blocks the way can become the way. Each setback is material for practicing patience, courage or fairness.","Take today's biggest annoyance and ask which virtue it lets you practice."],
["Meditations","Marcus Aurelius",180,"meaning","Your opinion causes the pain","Events are neutral. The suffering comes from the judgment you add on top. Drop the judgment and much of the harm goes with it.","Rewrite one complaint as a plain description of what happened, with no adjectives."],
["The 7 Habits of Highly Effective People","Stephen Covey",1989,"work","Important beats urgent","Urgent tasks shout. Important ones wait quietly until they turn into crises. Effective people spend more time on important work that isn't urgent yet: planning, relationships, health.","Move one important-but-not-urgent task into tomorrow morning, before email."],
["The 7 Habits of Highly Effective People","Stephen Covey",1989,"people","Seek first to understand","Most people listen with the intent to reply. When you truly understand someone's view first, they become far more willing to hear yours.","In your next disagreement, restate their point until they say yes, that's it."],
["Essentialism","Greg McKeown",2014,"work","If it isn't a clear yes, it's a no","Saying yes to everything spreads you thin, and the vital few things get the same effort as the trivial many. Being selective is a discipline, not a luxury.","Decline or defer one commitment this week that you only half want."],
["Sapiens","Yuval Noah Harari",2011,"strategy","Shared stories let strangers cooperate","Humans can coordinate in millions because they believe the same fictions: money, nations, companies, laws. These stories are invented, yet they run the world.","Notice which shared story is driving a decision at work this week, like a brand, a budget or a rank."],
["Mindset","Carol Dweck",2006,"mind","Add the word yet","People who see ability as fixed avoid challenges that might expose them. People who see it as growable treat failure as information. The belief itself changes how hard you try.","Catch one I'm not good at this today and finish it with yet."],
["Influence","Robert Cialdini",1984,"people","Give first","People feel a strong pull to repay what they receive, even small, unasked-for favors. A genuine first gift opens doors that a request never would.","Do one useful thing for a colleague today with no ask attached."],
["Influence","Robert Cialdini",1984,"people","We copy people like us","When unsure, we look at what similar others are doing. Showing that peers already act a certain way persuades better than any argument.","When pitching an idea, mention who like your listener has already adopted it."],
["Never Split the Difference","Chris Voss",2016,"people","Name the emotion","A former FBI negotiator found that calmly labeling what the other side feels, like it seems you're worried about timing, lowers tension and gets them talking.","In a tense conversation, try one It sounds like you… and then stay quiet."],
["Never Split the Difference","Chris Voss",2016,"people","Ask how, not why","Questions starting with how or what make the other side solve your problem with you. Why tends to sound like an accusation.","Swap a demand for How am I supposed to do that? and see what they offer."],
["The Lean Startup","Eric Ries",2011,"strategy","Ship the smallest test","Instead of building the full product, build the least you need to learn whether anyone wants it. Learning fast beats being right on the first try.","Take an idea you're sitting on and design a test you could run in a week."],
["Zero to One","Peter Thiel",2014,"strategy","Compete less, create more","Fierce competition erodes profits for everyone. The best businesses do something new so well that they have no close substitute.","Ask: what do I believe about my field that few people agree with?"],
["Range","David Epstein",2019,"work","Wander before you specialize","Many top performers sampled widely before settling. Breadth gives you analogies and transferable skills that narrow specialists miss, especially in messy, changing fields.","Spend 20 minutes this week learning something unrelated to your job."],
["Antifragile","Nassim Nicholas Taleb",2012,"strategy","Some things grow from shocks","Fragile things break under stress, robust things survive it, and antifragile things improve because of it. Muscles, startups and immune systems need some stress to get stronger.","Find one small, safe stressor to add: a harder workout, a stretch task, a tough critic."],
["Antifragile","Nassim Nicholas Taleb",2012,"strategy","Subtract before you add","Removing a bad habit, a toxic contact or a needless risk often does more good than adding something new. Improvement by removal is underrated.","List three things you could stop doing. Drop one of them this week."],
["Getting Things Done","David Allen",2001,"work","Your head is for ideas, not storage","Open loops in your mind drain attention even when you're not thinking about them. Capturing everything in a trusted list frees your head to focus.","Do a five-minute brain dump of every open task, then pick one next physical action."],
["The Almanack of Naval Ravikant","Eric Jorgenson",2020,"money","Seek leverage, not just hours","Pay for time has a ceiling. Code, media, capital and people multiply your effort, so one good decision can be worth more than a year of hard work.","Identify one task you repeat that could become a template, a tool or a script."],
["Poor Charlie's Almanack","Charlie Munger",2005,"mind","Invert, always invert","Hard problems often get easier backwards. Instead of asking how to succeed, ask what would guarantee failure, and avoid those things.","For your current project, list five ways to make it fail for sure."],
["How to Win Friends and Influence People","Dale Carnegie",1936,"people","Be interested, not interesting","People warm to those who show real curiosity about them. You'll make more friends in a month of genuine interest than in a year of trying to impress.","In your next chat, ask two follow-up questions before you share anything about yourself."],
["Drive","Daniel Pink",2009,"work","Carrots fail on creative work","Rewards help with routine tasks but can hurt creative ones. What drives people there is autonomy, getting better at something, and working toward a purpose.","Give someone on your team control over how a task gets done, not just what."],
["Thinking in Bets","Annie Duke",2018,"mind","Don't judge a decision by its result","A good decision can turn out badly through luck, and a bad one can turn out well. Judging only by outcomes teaches the wrong lessons.","Review a recent decision on what you knew at the time, not on how it ended."],
["Four Thousand Weeks","Oliver Burkeman",2021,"meaning","You will never clear the list","An average life is about four thousand weeks. Efficiency only invites more demands. Peace comes from choosing what to neglect, on purpose.","Choose one thing you'll consciously not do this week, and feel fine about it."],
["The Courage to Be Disliked","Kishimi & Koga",2013,"people","Separate your tasks from theirs","Much stress comes from carrying problems that belong to others, like their opinion of you. Ask whose task this really is, and leave theirs to them.","Pick one worry and ask: is this mine to solve, or theirs?"],
["Superforecasting","Philip Tetlock",2015,"mind","Update in small steps","The best forecasters aren't geniuses. They break questions into parts, start from base rates, and adjust gradually as evidence comes in, instead of lurching.","Put a probability on something you're unsure about. Revisit it next week."],
["Good to Great","Jim Collins",2001,"strategy","First who, then what","Great companies got the right people on board before deciding direction. The right people adapt to a changing plan; the wrong ones sink a good one.","Before your next project kicks off, think about who must be on it and who shouldn't."],
["High Output Management","Andrew Grove",1983,"work","A manager's output is the team's output","Your value as a leader is what your team and neighboring teams produce. Choose the activities with the highest leverage over that output.","Look at tomorrow's calendar. Which meeting has the most leverage? Prepare for it most."],
["Nudge","Thaler & Sunstein",2008,"strategy","Defaults decide","Most people stick with whatever option is pre-selected. Whoever sets the default, from pension plans to forms, shapes the outcome more than any argument.","Change one default in your own life, like auto-saving a fixed amount each payday."],
["Thinking in Systems","Donella Meadows",2008,"strategy","Fix the structure, not the symptom","Systems are stocks and flows tied together by feedback loops. Repeated problems usually come from the structure. Pushing harder on symptoms often makes them worse.","For a problem that keeps coming back, sketch what feeds it and what drains it."],
["Peak","Anders Ericsson",2016,"habits","Practice at the edge","Repetition alone doesn't build expertise. Getting better takes focused practice just beyond your current ability, with fast feedback on what went wrong.","Pick one skill and design a 20-minute drill that's slightly too hard."],
["The War of Art","Steven Pressfield",2002,"habits","Resistance is a signal","The stronger the urge to avoid a piece of work, the more it probably matters to you. Professionals show up anyway, on schedule, inspired or not.","Notice what you've been avoiding the most. Give it 25 minutes today."],
["Principles","Ray Dalio",2017,"mind","Pain plus reflection equals progress","Mistakes hurt, and the pain tempts you to look away. If you stop and examine what caused it, each failure becomes a rule you can reuse.","Write down your last mistake and one principle you'd follow next time."],
["Make It Stick","Brown, Roediger & McDaniel",2014,"habits","Test yourself to remember","Rereading feels productive but fades fast. Pulling information from memory, spaced over days, makes it stick far better.","Close this app and recall the last three ideas you read. Out loud, if you can."],
["The Mom Test","Rob Fitzpatrick",2013,"strategy","Ask about the past, not the future","People are polite about your idea and bad at predicting their own behavior. Ask what they did last time the problem came up, and what they spent fixing it.","Rewrite one would you use this? question as When did this last happen to you?"],
["Getting to Yes","Fisher & Ury",1981,"people","Interests, not positions","Two people want the same orange. One needs the peel, the other the juice. Arguing over positions hides interests that could both be met.","In your next conflict, ask what the other person needs this for."],
["Outliers","Malcolm Gladwell",2008,"work","Small early edges snowball","Slight advantages, like a birth month or early access to a computer, compound into big gaps. Success is rarely a solo story.","Think of one early break you got. Who could you give a similar one to?"]
];

/* ---------- ambience (generated sound, no files) ---------- */
let ac,amb=null;
function noise(kind){const len=ac.sampleRate*4,buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);let l=0,b0=0,b1=0,b2=0;
  for(let i=0;i<len;i++){const w=Math.random()*2-1;
    if(kind==="rain"){b0=.99765*b0+w*.099;b1=.963*b1+w*.2965;b2=.57*b2+w*1.0526;d[i]=(b0+b1+b2+w*.1848)*.11}
    else{l=(l+.02*w)/1.02;d[i]=l*3.5}}
  return buf}
function ambience(kind){
  if(amb){const a=amb;a.g.gain.setTargetAtTime(0,ac.currentTime,.3);setTimeout(()=>{try{a.s.stop();a.lfo&&a.lfo.stop()}catch(e){}},1200);amb=null}
  if(kind==="off")return;
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){show("Sound isn't available here");return}
  const s=ac.createBufferSource();s.buffer=noise(kind);s.loop=true;
  const f=ac.createBiquadFilter(),g=ac.createGain();g.gain.value=0;let lfo=null;
  if(kind==="rain"){f.type="highpass";f.frequency.value=380}
  if(kind==="ocean"){f.type="lowpass";f.frequency.value=650;lfo=ac.createOscillator();lfo.frequency.value=.09;const lg=ac.createGain();lg.gain.value=.16;lfo.connect(lg).connect(g.gain);lfo.start()}
  if(kind==="hearth"){f.type="lowpass";f.frequency.value=900}
  s.connect(f).connect(g).connect(ac.destination);s.start();
  g.gain.setTargetAtTime(kind==="ocean"?.22:kind==="rain"?.28:.3,ac.currentTime,.8);
  if(kind==="hearth"){const crack=()=>{if(!amb||amb.kind!=="hearth")return;const o=ac.createBufferSource(),len=ac.sampleRate*.02,b=ac.createBuffer(1,len,ac.sampleRate),c=b.getChannelData(0);for(let i=0;i<len;i++)c[i]=(Math.random()*2-1)*Math.pow(1-i/len,4);o.buffer=b;const cg=ac.createGain();cg.gain.value=.06+Math.random()*.1;o.connect(cg).connect(ac.destination);o.start();setTimeout(crack,120+Math.random()*900)};setTimeout(crack,500)}
  amb={s,g,lfo,kind};
}

/* ---------- deck ---------- */
function rng(seed){let s=0;for(const c of seed)s=(s*31+c.charCodeAt(0))>>>0;return()=>{s^=s<<13;s>>>=0;s^=s>>17;s^=s<<5;s>>>=0;return s/4294967296}}
function shuffle(a,seed){const r=rng(seed),b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function todaysDeck(){const seen=new Set(),out=[];for(const i of shuffle(ids,today)){if(seen.has(IDEAS[i][0]))continue;seen.add(IDEAS[i][0]);out.push(i);if(out.length===12)break}return out}
const SHELVES=[["today","Today"],["all","All 50"],...Object.entries(THEMES),["saved","Saved"]];
let shelf="today";
chipsEl.innerHTML=SHELVES.map(([k,n])=>`<button class="chip" data-k="${k}" aria-pressed="${k===shelf}">${n}</button>`).join("");
chipsEl.addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;shelf=b.dataset.k;
  chipsEl.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",c===b));render();feed.scrollTop=0});
function streak(){let n=0,d=new Date();const s=new Set(doneDays);for(;;){const k=d.toISOString().slice(0,10);if(s.has(k)){n++;d.setDate(d.getDate()-1)}else if(n===0&&k===today){d.setDate(d.getDate()-1)}else break}return n}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- progress ---------- */
const read=new Set();let current=0,activeSlot=null,io;
function observe(){io&&io.disconnect();io=new IntersectionObserver(es=>{es.forEach(e=>{if(!e.isIntersecting)return;const s=e.target;
    feed.querySelectorAll(".card.on").forEach(c=>c!==s.firstElementChild&&c.classList.remove("on"));s.firstElementChild.classList.add("on");activeSlot=s;
    if(s.dataset.i!==undefined){const i=+s.dataset.i;read.add(i);current=list.indexOf(i)+1;startTimer();if(listening)speak(i)}
    else if(s.dataset.end!==undefined){current=list.length;fillEnd();if(listening)stopSpeech()}
    else current=0;
    updateProgress()})},{root:feed,threshold:.55});
  feed.querySelectorAll(".slot").forEach(s=>io.observe(s))}
function updateProgress(){countEl.textContent=`${current} / ${list.length}`;
  if(list.length>16)segs.firstElementChild&&segs.firstElementChild.style.setProperty("--p",(current/list.length*100)+"%");
  else segs.querySelectorAll("i").forEach((s,k)=>s.classList.toggle("on",k<current))}
function fillEnd(){const r=[...read];$("#endLede").textContent=r.length?`You read ${r.length} idea${r.length>1?"s":""} in ${fmt(SESSION-left)}. Here they are, for a quick recall.`:"Swipe back up to start reading.";
  $("#endTime").textContent=finished?"5:00 done":fmt(SESSION-left);
  $("#endList").innerHTML=r.map(i=>`<li style="--c:var(--h-${IDEAS[i][3]})">${esc(IDEAS[i][4])}</li>`).join("")}

/* ---------- session clock ---------- */
const SESSION=300,C=50.27;let left=SESSION,tick=null,finished=false,lock=null;
const fmt=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
function paint(){timeEl.textContent=mini.textContent=finished?"Done":fmt(left);ring.style.strokeDashoffset=C*(1-left/SESSION)}
function startTimer(){if(tick||finished)return;keepAwake();tick=setInterval(()=>{if(document.hidden)return;left--;paint();if(left<=0)finish()},1000)}
function finish(){clearInterval(tick);tick=null;finished=true;clock.classList.add("done");paint();
  if(!doneDays.includes(today)){doneDays.push(today);doneDays=doneDays.slice(-400);store.set("days",doneDays)}
  buzz([20,60,20]);show(`Five minutes done · ${read.size} ideas read`)}
clock.onclick=()=>{if(finished){finished=false;left=SESSION;clock.classList.remove("done");paint();startTimer();show("New 5-minute session")}};
async function keepAwake(){try{lock=await navigator.wakeLock.request("screen")}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&tick)keepAwake()});
paint();

/* ---------- read aloud ---------- */
let listening=false,speakingI=null;const synth=window.speechSynthesis;
function speak(i){if(!synth)return;if(speakingI===i)return;synth.cancel();speakingI=i;
  const [b,a,,,idea,body,tr]=IDEAS[i];const u=new SpeechSynthesisUtterance(`${idea}. ${body} ${set.tryOn?"Try this. "+tr:""} From ${b}, by ${a}.`);
  u.rate=.98;u.onend=()=>{if(speakingI!==i)return;speakingI=null;markSpeaking();if(listening&&set.auto)setTimeout(()=>listening&&step(1),700);else{listening=false;markSpeaking()}};
  synth.speak(u);markSpeaking()}
function stopSpeech(){listening=false;speakingI=null;try{synth&&synth.cancel()}catch(e){}markSpeaking()}
function markSpeaking(){feed.querySelectorAll("[data-listen]").forEach(b=>{const on=listening&&+b.dataset.listen===speakingI;b.setAttribute("aria-pressed",on);b.closest(".card").classList.toggle("speaking",on)})}

/* ---------- interactions ---------- */
let tt;function show(m){toast.textContent=m;toast.hidden=false;clearTimeout(tt);tt=setTimeout(()=>toast.hidden=true,2400)}
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
function toggleSave(i,btn){saved.has(i)?saved.delete(i):saved.add(i);store.set("saved",[...saved]);(btn||feed.querySelector(`[data-save="${i}"]`))?.setAttribute("aria-pressed",saved.has(i));buzz(12);show(saved.has(i)?"Saved":"Removed from saved")}
function setFocus(on){document.body.classList.toggle("focus",on);setTimeout(()=>activeSlot&&activeSlot.scrollIntoView({block:"start"}),380)}
let tapT=null;
feed.addEventListener("click",e=>{
  const sv=e.target.closest("[data-save]"),cp=e.target.closest("[data-copy]"),ls=e.target.closest("[data-listen]"),go=e.target.closest("#go"),la=e.target.closest("[data-listen-all]"),to=e.target.closest("[data-goto]");
  if(sv)return toggleSave(+sv.dataset.save,sv);
  if(cp){const [b,a,,,idea,body]=IDEAS[+cp.dataset.copy];const p=navigator.clipboard&&navigator.clipboard.writeText(`${idea}\n${body}\n— ${b}, ${a}`);p?p.then(()=>show("Copied"),()=>show("Copy isn't allowed here")):show("Copy isn't allowed here");return}
  if(ls){if(!synth)return show("Read-aloud isn't available here");const i=+ls.dataset.listen;if(listening&&speakingI===i)return stopSpeech();listening=true;speakingI=null;speak(i);return}
  if(go){step(1);return}
  if(la){if(!synth)return show("Read-aloud isn't available here");listening=true;step(1);return}
  if(to){chipsEl.querySelector(`[data-k="${to.dataset.goto}"]`).click();return}
  if(e.target.closest("button,a,ul.readlist"))return;
  const slot=e.target.closest(".slot[data-i]");
  if(tapT){clearTimeout(tapT);tapT=null;if(slot){const i=+slot.dataset.i;if(!saved.has(i))toggleSave(i);const card=slot.firstElementChild,bu=document.createElement("span");bu.className="burst";bu.innerHTML=I.save;card.appendChild(bu);setTimeout(()=>bu.remove(),750)}return}
  tapT=setTimeout(()=>{tapT=null;setFocus(!document.body.classList.contains("focus"))},280);
});
function step(d){const slots=[...feed.querySelectorAll(".slot")];const k=Math.max(0,Math.min(slots.length-1,slots.indexOf(activeSlot)+d));
  slots[k]&&slots[k].scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"})}
addEventListener("keydown",e=>{if(!sheet.hidden){if(e.key==="Escape")openSheet(false);return}
  if(["ArrowDown","j","PageDown"," "].includes(e.key)){e.preventDefault();step(1)}
  else if(["ArrowUp","k","PageUp"].includes(e.key)){e.preventDefault();step(-1)}
  else if(e.key==="s"&&activeSlot&&activeSlot.dataset.i)toggleSave(+activeSlot.dataset.i);
  else if(e.key==="f")setFocus(!document.body.classList.contains("focus"));
  else if(e.key==="Escape")setFocus(false)});
// sound may only start after a tap, so resume a saved ambience on the first one
if(set.amb!=="off")addEventListener("pointerdown",()=>ambience(set.amb),{once:true});
applySet();render();
if("serviceWorker" in navigator&&location.protocol==="https:"&&!/claude|anthropic/.test(location.host))navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>

</body></html>
